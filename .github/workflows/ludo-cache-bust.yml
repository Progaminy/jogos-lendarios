name: Ludo cache bust

on:
  push:
    branches: [main]
    paths:
      - 'js/ludo/state.js'
      - 'js/ludo/room-authority-v1.js'
      - 'js/ludo/active-room-recovery.js'
      - 'js/ludo/route-compat.js'
      - 'js/platform/ludo-feature-loader.js'
      - '.github/workflows/ludo-cache-bust.yml'

permissions:
  contents: write

jobs:
  patch-live-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Force fresh Ludo boot assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('ludo.html')
          text = path.read_text(encoding='utf-8')
          replacements = {
              './js/ludo/state.js?v=20261004-2': './js/ludo/state.js?v=20261004-3',
              './js/ludo/room-state.js?v=20260928-1': './js/ludo/room-state.js?v=20261004-4',
              './js/ludo/room-state.js?v=20261004-3': './js/ludo/room-state.js?v=20261004-4',
              './js/platform/ludo-feature-loader.js?v=20261003-2': './js/platform/ludo-feature-loader.js?v=20261004-10',
              './js/platform/ludo-feature-loader.js?v=20261004-7': './js/platform/ludo-feature-loader.js?v=20261004-10',
              './js/platform/ludo-feature-loader.js?v=20261004-8': './js/platform/ludo-feature-loader.js?v=20261004-10',
              './js/platform/ludo-feature-loader.js?v=20261004-9': './js/platform/ludo-feature-loader.js?v=20261004-10',
              './ludo.js?v=20261004-2': './ludo.js?v=20261004-8',
              './ludo.js?v=20261004-7': './ludo.js?v=20261004-8',
              './js/ludo/route-compat.js?v=20261004-1': './js/ludo/route-compat.js?v=20261004-3',
              './js/ludo/route-compat.js?v=20261004-2': './js/ludo/route-compat.js?v=20261004-3',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          # O antigo recovery concorria com o state.room privado do ludo.js.
          # Remover todas as cópias e usar uma única ponte que escreve no próprio runtime state.
          text = re.sub(r'^\s*<script src="\./js/ludo/active-room-recovery\.js\?v=[^"]+" defer></script>\s*\n?', '', text, flags=re.M)
          text = re.sub(r'^\s*<script src="\./js/ludo/room-authority-v1\.js\?v=[^"]+" defer></script>\s*\n?', '', text, flags=re.M)

          route_compat = '  <script src="./js/ludo/route-compat.js?v=20261004-3" defer></script>\n'
          authority = '  <script src="./js/ludo/room-authority-v1.js?v=20261004-1" defer></script>\n'
          ludo_anchor = '  <script src="./ludo.js?v=20261004-8" defer></script>\n'

          if 'js/ludo/route-compat.js' not in text:
              text = text.replace(ludo_anchor, route_compat + ludo_anchor)
          text = text.replace(ludo_anchor, authority + ludo_anchor)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit cache bust if needed
        run: |
          if git diff --quiet -- ludo.html; then
            echo "ludo.html already points at authoritative room bridge"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ludo.html
          git commit -m "Use authoritative Ludo room runtime bridge"
          git push
