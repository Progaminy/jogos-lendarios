name: Jogos Lendários CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: jogos-lendarios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Front-end sync/animation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --check ludo.js
          node --check aviator.js
          for file in js/aviator/*.js; do node --check "$file"; done
          for file in dama*.js; do node --check "$file"; done
          node --check admin-ludo-emergency.js
          node --check app.js
          node --check social.js
          node --check js/platform/feature-loader.js
      - name: Dama frontend regression tests
        if: always()
        run: node --test tests/frontend/dama-*.test.cjs
      - name: Ludo clean rebuild regression tests
        if: always()
        run: node --test tests/frontend/ludo-rebuild.test.cjs tests/frontend/admin-ludo-*.test.cjs
      - name: Aviator admin control tests
        if: always()
        run: >-
          node --test
          tests/frontend/aviator-admin-cancel.test.cjs
          tests/frontend/aviator-admin-close.test.cjs
          tests/frontend/aviator-admin-reopen.test.cjs
          tests/frontend/aviator-admin-one-round-test.test.cjs
      - name: Aviator admin finance tests
        if: always()
        run: >-
          node --test
          tests/frontend/aviator-admin-bank-ledger.test.cjs
          tests/frontend/aviator-admin-bank-warning.test.cjs
          tests/frontend/aviator-admin-exposure.test.cjs
          tests/frontend/aviator-admin-house-indicator.test.cjs
      - name: Aviator admin audit and readiness tests
        if: always()
        run: >-
          node --test
          tests/frontend/aviator-admin-audit.test.cjs
          tests/frontend/aviator-admin-preflight.test.cjs
          tests/frontend/aviator-admin-readiness.test.cjs
      - name: Aviator betting and cash-out frontend tests
        if: always()
        run: >-
          node --test
          tests/frontend/aviator-amount-stepper.test.cjs
          tests/frontend/aviator-auto-cashout-sync.test.cjs
          tests/frontend/aviator-balance.test.cjs
          tests/frontend/aviator-bet-history-details.test.cjs
          tests/frontend/aviator-bet-result-state.test.cjs
          tests/frontend/aviator-live-return-confirmation.test.cjs
          tests/frontend/aviator-min-bet.test.cjs
          tests/frontend/aviator-next-round-bet.test.cjs
          tests/frontend/aviator-one-click-bet.test.cjs
          tests/frontend/aviator-personal-history.test.cjs
          tests/frontend/aviator-player-cancel.test.cjs
          tests/frontend/aviator-priority-cashout.test.cjs
          tests/frontend/aviator-single-click-cashout.test.cjs
          tests/frontend/aviator-stable-bet-button.test.cjs
          tests/frontend/aviator-two-bet-panels.test.cjs
      - name: Aviator flight runtime and performance frontend tests
        if: always()
        run: >-
          node --test
          tests/frontend/aviator-approved-reference-flow.test.cjs
          tests/frontend/aviator-countdown-separation.test.cjs
          tests/frontend/aviator-crash-animation.test.cjs
          tests/frontend/aviator-db-call-budget.test.cjs
          tests/frontend/aviator-haptics-preference.test.cjs
          tests/frontend/aviator-maintenance-polling.test.cjs
          tests/frontend/aviator-mobile-performance.test.cjs
          tests/frontend/aviator-module-boundaries.test.cjs
          tests/frontend/aviator-no-frame-persistence.test.cjs
          tests/frontend/aviator-observability-release-gate.test.cjs
          tests/frontend/aviator-offline-reconnect.test.cjs
          tests/frontend/aviator-realtime.test.cjs
          tests/frontend/aviator-refresh-during-flight.test.cjs
          tests/frontend/aviator-runtime.test.cjs
          tests/frontend/aviator-server-clock.test.cjs
          tests/frontend/aviator-sound-preference.test.cjs
          tests/frontend/home-aviator-nav-icon.test.cjs
      - name: Platform frontend regression tests
        if: always()
        run: node --test tests/frontend/lazy-game-loading.test.cjs tests/frontend/player-session-invalidation.test.cjs tests/frontend/point27-page-weight.test.cjs

  database:
    name: Database rules and finance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Initialize local Supabase config
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi

      - name: Start disposable local Supabase
        run: supabase start

      - name: Rebuild database from canonical migrations
        run: supabase db reset --local

      - name: Run pgTAP database suite
        run: supabase test db

      - name: Run authentication session regression checks
        env:
          JL_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          for file in tests/sql/auth/*.sql; do
            echo "::group::$file"
            psql "$JL_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f "$file"
            echo "::endgroup::"
          done

      - name: Run Dama transactional and rules regression checks
        env:
          JL_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          for file in tests/sql/dama-*.sql; do
            echo "::group::$file"
            psql "$JL_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f "$file"
            echo "::endgroup::"
          done

      - name: Run Ludo transactional and rules regression checks
        env:
          JL_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          for file in tests/sql/ludo-*.sql; do
            echo "::group::$file"
            psql "$JL_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f "$file"
            echo "::endgroup::"
          done

      - name: Run Aviator transactional regression checks
        env:
          JL_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          for file in tests/sql/aviator/*.sql; do
            if [ "$(basename "$file")" = "aviator_engine_preopen_gate.sql" ]; then
              continue
            fi
            echo "::group::$file"
            psql "$JL_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f "$file"
            echo "::endgroup::"
          done

      - name: Run Aviator concurrent cash-out test
        env:
          JL_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: bash tests/aviator-cashout-concurrency.sh

      - name: Run Aviator same-bet double-submit test
        env:
          JL_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: bash tests/aviator-cashout-same-bet-concurrency.sh

      - name: Run Aviator same-account tabs and login replacement test
        env:
          JL_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: bash tests/aviator-same-account-tabs-logins.sh

      - name: Run Aviator two-slot concurrency test
        env:
          JL_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: bash tests/aviator-two-slot-concurrency.sh

      - name: Run Aviator insufficient-balance concurrency test
        env:
          JL_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: bash tests/aviator-insufficient-balance-concurrency.sh

      - name: Run Aviator 100-player concurrent cash-out load
        env:
          JL_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          AVIATOR_LOAD_PLAYERS: 100
          AVIATOR_LOAD_PARALLEL: 25
        run: bash tests/aviator-cashout-load.sh

      - name: Run Aviator server-restart resilience test
        env:
          JL_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: bash tests/aviator-server-restart.sh

      - name: Run Aviator pre-open engine certification gate
        env:
          JL_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$JL_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f tests/sql/aviator/aviator_engine_preopen_gate.sql

      - name: Run room-entry concurrency test when local reconstruction supports it
        env:
          JL_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: bash tests/ci/run-point15-if-reconstructable.sh

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
