<!doctype html>
<html lang="pt-MZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0d14">
  <meta name="description" content="Tabuleiro dos Jogos Lendários — escolha Ludo Lendário ou Dama Lendária.">
  <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">
  <link rel="canonical" href="https://jogoslendarios.adadpsf.shop/tabuleiro.html">
  <title>Tabuleiro · Jogos Lendários</title>

  <style>
    .board-hub{max-width:980px;margin:0 auto}
    .board-hub-head{margin-bottom:16px}
    .board-hub-head h1{margin:.2rem 0 0;font-size:85%}
    .board-game-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    .board-game-card{display:grid;grid-template-rows:auto auto 1fr auto;gap:5px;min-height:250px;padding:22px;contain:layout paint}
    .board-game-preview{width:100%;display:grid;place-items:center;padding:10px;border-radius:18px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.07);overflow:hidden;text-decoration:none;cursor:pointer}
    .board-game-preview svg{display:block;width:min(100%,170px);height:auto;filter:drop-shadow(0 8px 14px rgba(0,0,0,.18))}
    .board-game-card h2{margin:-1px 0 0;font-weight:300;font-size:.88rem;line-height:1.1}
    .board-game-card p{margin:0;color:#97a7ba;line-height:1.5}
    .board-game-card .button{justify-self:start;min-width:110px;text-align:center}
    .board-social{margin-top:14px;padding:14px}
    .board-social-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
    .board-social-head h2{margin:0;font-size:1rem}
    .board-social-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
    .board-social-tabs button{min-height:38px;border:1px solid rgba(255,255,255,.09);border-radius:10px;background:#0b1727;color:#eef3f9;font-size:.76rem;font-weight:800}
    .board-social-tabs button.active{border-color:#f4bd42;background:rgba(244,189,66,.1)}
    .board-social-pane{display:grid;gap:7px;margin-top:10px;max-height:320px;overflow:auto}
    .board-social-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 9px;border:1px solid rgba(255,255,255,.07);border-radius:10px;background:rgba(255,255,255,.025)}
    .board-social-person{min-width:0;display:grid;gap:1px}
    .board-social-person strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.82rem}
    .board-social-person small{color:#91a2b7;font-size:.68rem}
    .board-social-actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
    .board-social-actions .button{padding:6px 9px;min-height:30px;font-size:.7rem}
    .board-game-choice{display:flex;gap:5px}
    .board-social-empty{padding:12px;text-align:center;color:#91a2b7;font-size:.76rem}
    .board-soon{display:none;margin-top:16px;padding:16px;text-align:center;font-weight:900}
    .board-soon:target{display:block}
    @supports (content-visibility:auto){
      .board-game-card{content-visibility:auto;contain-intrinsic-size:250px}
    }
    @media(max-width:640px){
      .board-game-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
      .board-game-card{min-height:0;padding:12px}
      .board-game-preview{padding:6px}
      .board-game-preview svg{width:min(100%,115px)}
      .board-game-card h2{font-size:.8rem}
      .board-game-card p{font-size:.75rem}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./index.html" aria-label="Jogos Lendários">Jogos <strong>Lendários</strong></a>
    <nav class="game-nav" aria-label="Categorias de jogos">
      <a href="./index.html#catalogo">Todos</a>

      <a class="nav-aviator-symbol" href="./aviator.html" aria-label="Aviator" title="Aviator"><span aria-hidden="true">✈</span></a>
      <a href="./tabuleiro.html">Tabuleiro</a>
      <a href="./index.html#playerArea">Conta</a>
    </nav>

  <main class="shell board-hub">
    <section class="board-hub-head">

      </article>
    </section>
    <section id="boardSocial" class="card board-social hidden" aria-label="Jogadores e convites">
      <div class="board-social-head">
        <div><p class="eyebrow">JOGADORES</p><h2>Online e convites</h2></div>
        <span id="boardOnlineCount" class="badge">0</span>
      </div>
      <div class="board-social-tabs" role="tablist">
        <button class="active" type="button" data-board-tab="online">Online</button>
        <button type="button" data-board-tab="following">Segue</button>
        <button type="button" data-board-tab="invites">Convites <span id="boardInviteCount">0</span></button>
      </div>
      <div id="boardOnlinePane" class="board-social-pane"></div>
      <div id="boardFollowingPane" class="board-social-pane hidden"></div>
      <div id="boardInvitesPane" class="board-social-pane hidden"></div>
